<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DENISE</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600&family=Roboto+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--steel-mid:#8a9199;--steel-shine:#eef0f2;--wood-light:#c8a97e;--wood-mid:#9b7a52;--wood-dark:#5c3d1e;
--electric:#0a6fff;--electric-glow:rgba(10,111,255,.35);--electric-dim:rgba(10,111,255,.12);
--bg:#16191c;--surface:#1e2226;--border:rgba(212,216,220,.1);--border-wood:rgba(200,169,126,.2);
--text:#d4d8dc;--muted:rgba(212,216,220,.45);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(hover:hover){body,button,label,input,textarea{cursor:crosshair}}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;background:repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(255,255,255,.013) 2px,rgba(255,255,255,.013) 3px),repeating-linear-gradient(180deg,transparent,transparent 60px,rgba(255,255,255,.007) 60px,rgba(255,255,255,.007) 61px)}
body::after{content:'';position:fixed;inset:-50%;width:200%;height:200%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");pointer-events:none;z-index:9997;opacity:.4;animation:grain .8s steps(1) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-2%,-4%)}50%{transform:translate(-5%,2%)}75%{transform:translate(3%,-1%)}100%{transform:translate(2%,-3%)}}
header{position:fixed;top:0;left:0;right:0;z-index:500;height:calc(72px + env(safe-area-inset-top,0px));padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;background:rgba(22,25,28,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
header::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);pointer-events:none}
.logo{font-family:'Roboto Mono',monospace;font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--electric);display:inline-block;transform:scaleY(.95);position:relative;line-height:20px;align-self:center;margin-bottom:10px;z-index:1;white-space:nowrap}
.logo .ln{display:inline-block;width:2.1ch;height:2px;background:var(--electric);vertical-align:-.1em}
.header-appt{line-height:13px;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--steel-mid);position:relative;top:-1px;z-index:1}
.hdr-r{position:relative;z-index:1;text-align:right;white-space:nowrap;align-self:center;margin-bottom:10px}
.hdr-date{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 33px);z-index:1;text-align:left;white-space:nowrap}
.hdr-style{line-height:20px;font-size:12px;margin:0;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--electric)}
.sp{display:inline-block;width:.3em}.sp.w{width:.6em}
.hdr-sub,.hdr-date{line-height:10px;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:1px}
#prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--electric);box-shadow:0 0 10px var(--electric-glow);transition:width .3s;z-index:2}
.hero-banner{width:100%;height:220px;margin-top:calc(72px + env(safe-area-inset-top,0px));overflow:hidden;position:relative}
.hero-banner img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:brightness(.85)}
.hero-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--bg) 100%)}
main{max-width:640px;margin:0 auto;padding:8px 12px 56px;position:relative}
.sec-eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--electric);margin-bottom:12px}
.sec{margin-bottom:34px}
.menu-tabs{display:flex;border:1px solid var(--border);margin:6px 0 18px}
.menu-tab{flex:1;padding:11px 8px;background:none;border:none;border-right:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:12.5px;text-transform:uppercase;transition:all .2s}
.menu-tab:last-child{border-right:none}
.menu-tab:hover{color:var(--steel-shine);background:rgba(255,255,255,.03)}
.menu-tab.active{color:#fff;background:rgba(10,111,255,.8)}
.booking-notice{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--border-wood);background:rgba(200,169,126,.05);padding:16px 18px;margin-bottom:26px}
.notice-icon{color:var(--wood-light);font-size:16px;flex-shrink:0;opacity:.8}
.booking-notice p{font-size:11px;line-height:1.85;color:var(--muted);letter-spacing:.02em}
.f-field{margin-bottom:16px}
.f-lbl{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.f-in,.f-ta{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;font-size:16px;padding:12px 15px;outline:none;border-radius:0;transition:border-color .2s,box-shadow .2s}
.f-ta{resize:none;min-height:112px}
.f-in:focus,.f-ta:focus{border-color:var(--electric);box-shadow:0 0 16px var(--electric-dim)}
.menu-panel{border:1px solid var(--border)}
.svc-row{padding:11px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;transition:background .2s;position:relative;gap:14px;overflow:hidden}
.svc-row input{position:absolute;opacity:0;pointer-events:none}
.svc-row::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--electric);box-shadow:0 0 8px var(--electric-glow);transform:scaleY(0);transition:transform .2s;transform-origin:bottom}
.svc-row:last-child{border-bottom:none}
.svc-row:hover{background:rgba(10,111,255,.06)}
.svc-row:hover::after,.svc-row.sel::after{transform:scaleY(1)}
.svc-row.sel{background:rgba(10,111,255,.11)}
.svc-check{width:16px;height:16px;border:1px solid var(--steel-mid);flex-shrink:0;position:relative;transition:all .15s}
.svc-row.sel .svc-check{background:var(--electric);border-color:var(--electric);box-shadow:0 0 8px var(--electric-glow)}
.svc-row.sel .svc-check::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.svc-name{font-weight:600;font-size:13px;color:var(--steel-shine);text-transform:uppercase}
.btn-book{width:100%;height:50px;background:var(--electric);color:#fff;font-family:inherit;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border:none;position:relative;overflow:hidden;transition:all .25s;margin-top:8px;box-shadow:0 0 32px var(--electric-glow);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-book::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:translateX(-100%);transition:transform .5s}
.btn-book:hover::before{transform:translateX(100%)}
.btn-book:hover{box-shadow:0 0 48px var(--electric-glow);transform:translateY(-1px)}
.btn-book:disabled{opacity:.28;cursor:not-allowed;transform:none;box-shadow:none}
.btn-alt{display:block;width:100%;background:none;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:11px;padding:14px;letter-spacing:.1em;text-transform:uppercase;text-align:center;text-decoration:none;margin-top:8px;transition:all .2s}
.btn-alt:hover{color:var(--electric);background:var(--electric-dim);border-color:var(--electric)}
.confirm-banner{display:flex;align-items:flex-start;gap:16px;padding:18px;background:rgba(10,111,255,.08);border:1px solid rgba(10,111,255,.25);margin-bottom:18px}
.confirm-banner-icon{width:30px;height:30px;background:var(--electric);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 0 16px var(--electric-glow)}
.confirm-banner-title{font-weight:700;font-size:15px;color:var(--steel-shine);margin-bottom:4px}
.confirm-banner-sub{font-size:10px;line-height:1.7;color:var(--muted)}
.back .row{display:flex;gap:8px;margin-top:12px}.back .row>*{flex:1;margin:0;height:44px;padding:0}
.back .btn-book{filter:saturate(.55) brightness(.82);box-shadow:0 0 14px var(--electric-dim)}.back .btn-book:hover{box-shadow:0 0 20px var(--electric-dim)}
.confirm-summary{border:1px solid var(--border);background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.m-sec{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--electric);margin-top:8px}
.m-row{display:flex;justify-content:space-between;font-size:12px;gap:16px}
.m-row span:first-child{color:var(--muted);flex-shrink:0;max-width:45%}
.m-row span:last-child{color:var(--steel-shine);text-align:right;word-break:break-word}
.saved{font-size:9px;letter-spacing:.1em;color:var(--muted);margin:-14px 0 22px}
.cmsg{font-size:11px;color:var(--electric);min-height:18px;margin-top:10px;text-align:center}
#upbar{display:flex;align-items:center;gap:10px;margin:0 0 14px}#upbar[hidden]{display:none}.uptrack{flex:1;height:4px;background:var(--border);overflow:hidden}#upfill{height:100%;width:0;background:var(--electric);box-shadow:0 0 10px var(--electric-glow);transition:width .2s}#uppct{font-size:10px;letter-spacing:.1em;color:var(--muted);min-width:4ch;text-align:right}
.m-li{font-size:12px;color:var(--steel-shine);line-height:1.6;padding-left:14px;position:relative}.m-li::before{content:'–';position:absolute;left:0;color:var(--muted)}.m-li.sub{padding-left:30px}.m-li.sub::before{content:''}.m-sec{margin-top:14px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"co cm" "cl cx" "cn2 cn2";border-top:1px solid var(--border);border-left:1px solid var(--border);background:var(--surface)}
.cg{padding:14px 12px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-width:0}
.cg .m-sec{margin-top:0;margin-bottom:10px}.cg .m-li{font-size:11px;margin-bottom:9px;padding-left:12px;word-break:break-word}.cg .m-li.sub{padding-left:12px}
.cn{grid-area:cn}.co{grid-area:co}.cm{grid-area:cm}.cl{grid-area:cl}.ct{grid-area:ct}.cn2{grid-area:cn2}
@media(max-width:420px){.cg{padding:12px 10px}.cg .m-li{font-size:10px}}
.m-li,.m-row span:last-child,.svc-name{font-family:'Source Sans 3',system-ui,-apple-system,sans-serif}
.cg .m-li{font-size:11px;line-height:1.1}.m-row span:last-child{font-size:14px}.svc-name{font-size:14px;letter-spacing:.02em}
@media(max-width:420px){.cg .m-li{font-size:11px}}
.cg .m-li.tight{margin-bottom:0}
.cx{grid-area:cx}
.cg .m-li{color:var(--steel-mid)}
.f-ta{min-height:40px;padding:9px 15px;overflow:hidden}
.f-lbl.q{padding-left:4.2ch;text-indent:-4.2ch}
.f-lbl.q b{color:#fff;font-weight:400;font-style:italic;margin:0 .25em}
.f-lbl.q .qn{display:inline-block;width:4.2ch;text-indent:0}
.f-lbl.q{white-space:pre-line;font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;font-size:12px;letter-spacing:0;text-transform:none;color:var(--steel-mid);line-height:1.15;margin-bottom:8px}

.tri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tri .f-in{padding:9px 8px;height:40px}
.tri .f-lbl{margin-bottom:6px;white-space:nowrap;letter-spacing:.04em;font-size:8.5px}
.sec-eyebrow+.f-field .tri{margin-top:0}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ref{border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}
.ref-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:#0e1013}
.ref-img img{width:100%;height:100%;object-fit:cover;display:block}
.ref-x{position:absolute;top:6px;right:6px;width:26px;height:26px;border:1px solid var(--border);background:rgba(22,25,28,.8);color:var(--text);font:16px/1 'IBM Plex Mono',monospace}
.ref-add{grid-column:1/-1;min-height:48px;background:none;border:1px dashed var(--steel-mid);color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.ref-add:hover{border-color:var(--electric);color:var(--steel-shine)}
.ref-hint{grid-column:1/-1;font-size:10px;line-height:1.7;color:var(--muted)}
#gate{position:fixed;inset:0;z-index:10000;background:var(--bg);overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
#gate form{width:100%;max-width:340px;margin:0 auto;padding:8px 24px 0}
.pw{position:relative}.pw .f-in{padding-right:48px}.pw-t{position:absolute;right:0;top:0;bottom:0;width:48px;padding:0;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--muted)}.pw-t:hover{color:var(--steel-shine)}
#gate .btn-book{filter:brightness(.75);box-shadow:0 0 16px var(--electric-glow)}
.hdr-r .header-appt{position:absolute;right:0;top:100%}
#gate .g-err{min-height:16px;font-size:11px;color:#ff6b6b;margin-top:10px}
html.lock,html.lock body{overflow:hidden}
#bnr{position:relative;overflow:hidden;align-items:center}
#bnr .sweep{position:absolute;left:0;bottom:0;height:2px;width:35%;background:linear-gradient(90deg,transparent,var(--electric),transparent);box-shadow:0 0 10px var(--electric-glow);animation:sweep 1.2s ease-in-out infinite}
#bnr:not(.sending) .sweep,#bnr:not(.sending) .dots{display:none}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dots i{font-style:normal;opacity:.2;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}
#bnr.failed .confirm-banner-icon{background:#ff6b6b;box-shadow:none}
</style>
</head>

const KEY='other-questionnaire-v1';

function refsHTML(k,v){v=v||[];return v.map((x,i)=>`<div class="ref"><div class="ref-img"><img src="${x.src}" alt=""><button type="button" class="ref-x" data-rm="${k}:${i}" aria-label="Remove image">×</button></div></div>`).join('')+`<button type="button" class="ref-add" data-add="${k}">+ Add image${v.length?'s':''}</button>`+(v.length?`<div class="ref-hint">Your images are sent along with your answers when you press Submit.</div>`:'')}
function paintRefs(k){const el=$('#refs-'+k);if(!el)return;el.innerHTML=refsHTML(k,st.d[st.form][k]);el.querySelectorAll('.f-ta').forEach(grow);progress()}
function shrink(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=720,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-add]'),x=e.target.closest&&e.target.closest('[data-rm]');
if(a){const f=$('#file-'+a.dataset.add);if(f)f.click();return}
if(x){const[k,i]=x.dataset.rm.split(':'),d=st.d[st.form];(d[k]||[]).splice(+i,1);if(!d[k].length)delete d[k];paintRefs(k);save()}});
document.addEventListener('change',async e=>{const el=e.target;if(!el.id||!el.id.startsWith('file-'))return;const k=el.id.slice(5),d=st.d[st.form];
for(const f of [...el.files]){if((d[k]||[]).length>=8)break;const src=await shrink(f);if(src){(d[k]=d[k]||[]).push({src,note:''})}}
el.value='';paintRefs(k);save()});

function grow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px'}
function fields(){return FORMS[st.form].s.flatMap(s=>s[1])}
const filled=v=>Array.isArray(v)?v.length>0:!!(v&&String(v).trim());
function progress(){const d=st.d[st.form],f=fields();$('#prog').style.width=Math.round(f.filter(x=>x.ks?x.ks.some(k=>filled(d[k])):filled(d[x.k])).length/f.length*100)+'%';const b=$('#go');if(b)b.disabled=!hasData()}
